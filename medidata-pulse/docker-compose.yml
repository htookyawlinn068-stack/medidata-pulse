version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medidata_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: medidata_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:latest
    container_name: medidata_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: medidata_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  mongo_data: